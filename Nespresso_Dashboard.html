<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motion Dashboard</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="assets/nespresso-dashboard/css/dashboard.css" />
</head>
<body>
  <div class="page" id="appRoot">

    <section class="header">
      <div class="header-left">
        <h1 class="title" id="dashboardTitle">Motion Dashboard</h1>
        <p class="sub">Motion graph synchronized with video — nodes = actions, directed edges = transitions</p>
      </div>
      <div class="header-right">
        <div class="recipe-selector">
          <label for="recipeSelect" class="control-label">Recipe:</label>
          <select id="recipeSelect" class="control-select">
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="pill" id="summaryPill">Loading...</div>
      </div>
    </section>

    <!-- Session picker — tab-style buttons. Hidden until manifest is loaded. -->
    <section class="session-picker-row" id="sessionPickerRow" style="display:none;">
      <label class="control-label">Session:</label>
      <div class="session-picker-tabs" id="sessionPickerTabs">
        <!-- buttons injected by app.js -->
      </div>
    </section>

    <section class="layout">
      <article class="panel">
        <h2>
          Motion Graph
          <span class="graph-hint">— scroll to zoom · drag to pan</span>
        </h2>
        <div class="controls-row">
          <label class="control-label">Detail Level:</label>
          <select id="graphModeSelect" class="control-select">
            <option value="smart">Smart-Merged</option>
            <option value="full">Full Raw</option>
            <option value="abstracted">Recipe Steps</option>
          </select>
        </div>
        <div class="controls-row">
          <label class="control-label">Color encodes:</label>
          <select id="colorEncodeSelect" class="control-select">
            <option value="category">Action category</option>
            <option value="phase">Recipe step</option>
            <option value="duration">Mean duration</option>
          </select>
          <label class="control-label">Node size:</label>
          <select id="sizeEncodeSelect" class="control-select">
            <option value="frequency">Frequency</option>
            <option value="duration">Duration</option>
          </select>
          <label class="control-label">Layout:</label>
          <select id="layoutModeSelect" class="control-select">
            <option value="temporal">Temporal</option>
            <option value="category">Categorical</option>
          </select>
        </div>
        <div class="controls-row">
          <label class="control-label">Min. Transition Count:</label>
          <input type="range" id="edgeThreshold" min="1" max="5" value="1" class="control-slider" />
          <span id="thresholdLabel" class="threshold-label">1</span>
        </div>
        <div id="graphWrap">
          <svg id="graphSvg"></svg>
          <div class="zoom-controls">
            <button id="zoomIn"    title="Zoom in">+</button>
            <button id="zoomReset" title="Fit to view">⊙</button>
            <button id="zoomOut"   title="Zoom out">−</button>
            <button id="resetLayout" title="Reset node positions">↺</button>
          </div>
        </div>
        <div class="legend-strip" id="legendStrip"></div>
      </article>

      <article class="panel">
        <h2>Video Player</h2>
        <video id="video" controls preload="metadata"></video>
        <div id="annotationTimeline" class="annotation-timeline"></div>
        <div class="meta">
          <div class="row"><span>Recipe</span><span id="recipeLabel">-</span></div>
          <div class="row"><span>Session</span><span id="sessionLabel">-</span></div>
          <div class="row"><span>Video</span><span id="videoLabel">-</span></div>
          <div class="row"><span>Time</span><span id="timeLabel">0.00 s</span></div>
          <div class="row"><span>Current Action</span><span id="actionLabel">-</span></div>
          <div class="status" id="statusLabel">Status: <strong>Idle</strong></div>
        </div>
      </article>
    </section>

    <section class="footerPanel">
      <table class="timeline">
        <thead>
          <tr>
            <th>#</th><th>Action</th><th>Step</th><th>Start</th><th>End</th><th>Duration</th>
          </tr>
        </thead>
        <tbody id="timelineBody"></tbody>
      </table>
    </section>

  </div>

  <div id="edgeTooltip" class="hover-tooltip"></div>
  <div id="nodeTooltip" class="hover-tooltip"></div>

  <script type="module" src="assets/nespresso-dashboard/js/app.js"></script>
</body>
</html>
